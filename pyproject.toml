[build-system]
# uv build doesn't support dynamic version yet
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ewok"
description = "Education Warehouse Octopus Kit - Extensible CLI framework with plugin support"
readme = "README.md"
authors = [
    { name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" },
    { name = "Remco Boerma", email = "remco.b@educationwarehouse.nl" },
]
requires-python = ">=3.12"
dependencies = [
    "docstring_parser < 1", # better help
    "fabric >= 3.1, < 4", # invoke but remote
    "invoke >= 2.1, < 3", # base cli tool
    "termcolor < 3", # improved ansi colored print (v3 removes Color type)
    "typing-extensions < 5", # using modern typing features in older python versions
]
version = "0.5.3"

[project.urls]
Documentation = "https://github.com/educationwarehouse/ewok#readme"
Issues = "https://github.com/educationwarehouse/ewok/issues"
Source = "https://github.com/educationwarehouse/ewok"

[tool.vommit]
allow_breaking_bang = true
allow_breaking_footer = true
prerelease_token = "beta"
confirm = true

[tool.vommit.git]
enabled = true
origin = "origin"
branch = "master"
on_wrong_branch = "error"
tag_format = "v{version}"
commit_format = "{version}"

[tool.vommit.changelog]
enabled = true
file = "CHANGELOG.md"
include_prereleases = false
placeholder = "<!--next-version-placeholder-->"
placeholder_regex = "<auto>"
entry_title_format = "## v{version} ({date:%Y-%m-%d})"

[tool.vommit.changelog.levels]
feat = "Feature{s}"
fix = "Fix{es}"
break = "Breaking Change{s}"
docs = "Documentation"
perf = "Performance"

[tool.vommit.pypi]
enabled = true
use_keyring = true

[tool.vommit.commands]
clean = "rm -rf ./dist"
build = "uv build"
publish = "uv publish"
post_publish = ""

[tool.vommit.version_bump_map]
break = "major"
feat = "minor"
fix = "patch"
perf = "patch"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]

select = [
    "F", # pyflake error
    "E", # pycodestyle error
    "W", # pycodestyle warning
    "Q", # quotes
    "A", # builtins
    # "C4", # comprehensions
    # "RET", # return
    "SIM", # simplify
    "ARG", # unused arguments
    # "COM", # comma's
    "PTH", # use pathlib
    "RUF", # ruff rules
    "C90", # mccabe (complexity)
    #    "I", # isort
    "N", # pep-8 naming
    # "D", # pydocstyle
    # "UP", # pyupgrade
    "YTT", # flake8-2020 (version hardcoding)
    # "ANN", # annotations - werkt niet goed samen met invoke
    # "ASYNC", # async - gebruiken we hier niet
    # "S", # bandit (security)
    # "BLE", # blind except
    # "FBT", # boolean trap
    # "B", # bugbear
    # "DTZ", # datetimes
    # "T10", # debugger
    # "DJ", # django
    # "ISC", # implicit string concat (handig voor als je een , mist in een lijst bijv.)
    "SIM", # simplify
]

ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "RUF002", # allow - in docstrings
    "RUF012", # CUSTOM_FLAGS is a mutable class-level extension point
]
