[build-system]
# uv build doesn't support dynamic version yet
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ewok"
description = "Education Warehouse Octopus Kit - Extensible CLI framework with plugin support"
readme = "README.md"
authors = [
    { name = "Robin van der Noord", email = "robin.vdn@educationwarehouse.nl" },
    { name = "Remco Boerma", email = "remco.b@educationwarehouse.nl" },
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "docstring_parser < 1", # better help
    "fabric >= 3.1, < 4", # invoke but remote
    "invoke >= 2.1, < 3", # base cli tool
    "termcolor < 3", # improved ansi colored print (v3 removes Color type)
    "typing-extensions < 5", # using modern typing features in older python versions
]

[project.urls]
Documentation = "https://github.com/educationwarehouse/ewok#readme"
Issues = "https://github.com/educationwarehouse/ewok/issues"
Source = "https://github.com/educationwarehouse/ewok"

[tool.hatch.version]
path = "src/ewok/__about__.py"

[tool.semantic_release]
branch = "master"
version_variable = "src/ewok/__about__.py:__version__"
change_log = "CHANGELOG.md"
upload_to_repository = false
upload_to_release = false
build_command = "uv build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]

select = [
    "F", # pyflake error
    "E", # pycodestyle error
    "W", # pycodestyle warning
    "Q", # quotes
    "A", # builtins
    # "C4", # comprehensions
    # "RET", # return
    "SIM", # simplify
    "ARG", # unused arguments
    # "COM", # comma's
    "PTH", # use pathlib
    "RUF", # ruff rules
    "C90", # mccabe (complexity)
    #    "I", # isort
    "N", # pep-8 naming
    # "D", # pydocstyle
    # "UP", # pyupgrade
    "YTT", # flake8-2020 (version hardcoding)
    # "ANN", # annotations - werkt niet goed samen met invoke
    # "ASYNC", # async - gebruiken we hier niet
    # "S", # bandit (security)
    # "BLE", # blind except
    # "FBT", # boolean trap
    # "B", # bugbear
    # "DTZ", # datetimes
    # "T10", # debugger
    # "DJ", # django
    # "ISC", # implicit string concat (handig voor als je een , mist in een lijst bijv.)
    "SIM", # simplify
]

ignore = [
    # Allow non-abstract empty methods in abstract base classes
    "B027",
    # Allow boolean positional values in function calls, like `dict.get(... True)`
    "FBT003",
    # Ignore checks for possible passwords
    "S105", "S106", "S107",
    # Ignore complexity
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
    "RUF002", # allow - in docstrings
    "RUF012", # CUSTOM_FLAGS is a mutable class-level extension point
]
